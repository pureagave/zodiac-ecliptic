name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default list includes the long-retired "tools" package, which
        # current runner images no longer resolve; AGP fetches the rest.
        with:
          packages: platform-tools

      # Uses the project's Gradle wrapper (8.10.2) as the single source of
      # truth for the Gradle version; the action provides dependency caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Deliberately UNSCOPED (not :app:). :beacon had no CI of any kind until
      # 2026-08-10 -- its 77 unit tests, ktlint, detekt, lint and assemble had
      # never run on a push, on the one module that must survive a reboot and run
      # unattended for a week. Unscoping also means a fourth module is covered the
      # day it is added, rather than the day someone remembers to add a step.
      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Detekt
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Prints the per-module totals from the JUnit XML, so the test counts
      # quoted in README.md can be checked against any run.
      - name: Test counts
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| module | tests | skipped | failed |")
          print("|---|---|---|---|")
          for m in ("app", "beacon"):
              t = s = f = 0
              for p in glob.glob(f"{m}/build/test-results/testDebugUnitTest/*.xml"):
                  r = ET.parse(p).getroot()
                  t += int(r.get("tests"))
                  s += int(r.get("skipped"))
                  f += int(r.get("failures")) + int(r.get("errors"))
              print(f"| :{m} | {t} | {s} | {f} |")
          PY

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace
