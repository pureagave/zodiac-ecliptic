name: secrets-scan

# Every push and PR: scan the full history for secrets. The public repo is an
# export with a scrubbed history, and this keeps it that way.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --redact --no-banner --exit-code 1 .
