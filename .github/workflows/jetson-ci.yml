name: jetson-ci

on:
  push:
    branches: [main]
    paths: ["jetson/**", "protocol/**", ".github/workflows/jetson-ci.yml"]
  pull_request:
    paths: ["jetson/**", "protocol/**", ".github/workflows/jetson-ci.yml"]
  workflow_dispatch:

jobs:
  zvision-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Core + tests are standard-library only, so no install step is needed.
      - name: Run zvision unit tests
        working-directory: jetson
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee unittest.log
          grep -E "^Ran [0-9]+ tests" unittest.log | sed 's/^/jetson: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Byte-check the runner emits a frame
        working-directory: jetson
        run: python -m zvision --once -v
